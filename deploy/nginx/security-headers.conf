# En-têtes de sécurité communs. Inclus dans CHAQUE bloc `location` qui pose
# lui-même un `add_header` : sinon Nginx n'hérite PAS des `add_header` du bloc
# parent (voir docs/manuel_deploiement.md §4.6). `always` = même sur les erreurs.
add_header Strict-Transport-Security "max-age=63072000"                  always;
add_header X-Content-Type-Options    "nosniff"                           always;
add_header X-Frame-Options           "SAMEORIGIN"                        always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
# CSP : à activer après vérification (Angular + spartan/ui posent des styles
# en ligne). Voir manuel §4.6.
# add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'" always;
