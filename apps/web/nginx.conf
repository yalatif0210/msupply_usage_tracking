# Nginx de la démo : sert le SPA Angular et relaie /api vers le conteneur API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Actifs hachés (outputHashing: all) : cache long.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dépôt d'un classeur : staging, promotion et recalcul des scores dans la
    # même requête, plusieurs minutes pour un fichier réel. Au-delà du délai,
    # Nginx répond 504 alors que l'import aboutit côté API : l'écran affichait
    # une erreur pour un lot en fait validé.
    location = /api/imports {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 32m;
    }

    # API : reverse-proxy vers le service `api` du compose.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 32m;        # taille d'un classeur d'extraction
    }

    # SPA : toute autre route retombe sur index.html (routing Angular).
    # `no-cache` : index.html est revalidé à chaque visite, sinon un
    # redéploiement laisse le navigateur pointer vers d'anciens chunks hachés.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
