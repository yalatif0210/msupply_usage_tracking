# Nginx de la démo : sert le SPA Angular et relaie /api vers le conteneur API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Actifs hachés (outputHashing: all) : cache long.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API : reverse-proxy vers le service `api` du compose.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;         # import de classeur : peut être long
        client_max_body_size 32m;        # taille d'un classeur d'extraction
    }

    # SPA : toute autre route retombe sur index.html (routing Angular).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
